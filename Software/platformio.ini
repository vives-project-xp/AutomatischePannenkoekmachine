; PlatformIO-configuratie voor de automatische pannenkoekmachine.
; Bord: NodeMCU ESP32-S (ESP32-WROOM-32, 38 pins) -> esp32dev.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Stappulsen worden door hardware gemaakt (niet-blokkerend)
lib_deps =
    gin66/FastAccelStepper@^0.31.6

; Seriele monitor als testinterface
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
