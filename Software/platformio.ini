; PlatformIO-configuratie voor de automatische pannenkoekmachine.
; Bord: NodeMCU ESP32-S (ESP32-WROOM-32, 38 pins) -> esp32dev.

; Build/Upload-knop gebruikt alleen het hoofdprogramma.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Stappulsen worden door hardware gemaakt (niet-blokkerend)
lib_deps =
    gin66/FastAccelStepper@^0.31.6

; ESP32 hangt via CP210x USB-UART aan COM4
upload_port = COM4
monitor_port = COM4

; Lagere uploadsnelheid: 460800 gaf seriele ruis (Invalid head of packet)
upload_speed = 115200

; Seriele monitor als testinterface
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
